<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador Doggycraft - Arnés Biothane</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        doggy: { base: '#FAF8F5', dark: '#3E2A1E', accent: '#C88C50', border: '#E5DED5' }
                    },
                    fontFamily: { sans: ['Montserrat', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FAF8F5; color: #3E2A1E; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #FAF8F5; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E5DED5; border-radius: 10px; }
        .pattern-overlay { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 8px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- BASES DE DATOS DEL PRODUCTO ---
        const PRODUCT = { basePrice: 59.90, namePrice: 4.90, phonePrice: 2.90, patternPrice: 4.90, decorPrice: 5.90, handlePrice: 3.90 };

        const SIZES = [
            { id: 'XXS', name: 'XXS', neck: '20 - 30 cm', chest: '30 - 40 cm', allowedWidths: ['2cm'] },
            { id: 'XS', name: 'XS', neck: '25 - 40 cm', chest: '35 - 50 cm', allowedWidths: ['2cm', '2,5cm'] },
            { id: 'S', name: 'S', neck: '35 - 50 cm', chest: '50 - 70 cm', allowedWidths: ['2,5cm', '3,8cm'] },
            { id: 'M', name: 'M', neck: '40 - 60 cm', chest: '55 - 80 cm', allowedWidths: ['2,5cm', '3,8cm'] },
            { id: 'L', name: 'L', neck: '45 - 65 cm', chest: '65 - 95 cm', allowedWidths: ['2,5cm', '3,8cm'] },
            { id: 'XL', name: 'XL', neck: '55 - 97 cm', chest: '85 - 134 cm', allowedWidths: ['3,8cm'] }
        ];

        const BIOTHANE_COLORS = [
            { id: 'marron_oscuro', name: 'Marrón Oscuro', hex: '#3b2f2f' }, { id: 'marron_claro', name: 'Marrón Claro', hex: '#a65e2e' },
            { id: 'beige_gris', name: 'Beige/Gris', hex: '#d1c7b8' }, { id: 'granate', name: 'Granate', hex: '#63252b' },
            { id: 'azul', name: 'Azul', hex: '#87a8c4' }, { id: 'blanco', name: 'Blanco', hex: '#ffffff' }, { id: 'negro', name: 'Negro', hex: '#1f1f1f' }
        ];

        const PADDING_COLORS = [
            { id: 'no', name: 'No', hex: 'transparent', price: 0 },
            { id: 'marron_oscuro', name: 'Marrón Oscuro', hex: '#3b2f2f', price: 4.90 },
            { id: 'beige_gris', name: 'Beige/Gris', hex: '#d1c7b8', price: 4.90 },
            { id: 'granate', name: 'Granate', hex: '#63252b', price: 4.90 },
            { id: 'blanco', name: 'Blanco', hex: '#ffffff', price: 4.90 },
            { id: 'negro', name: 'Negro', hex: '#1f1f1f', price: 4.90 }
        ];

        const TACHUELAS_COLORS = [{ id: 'negras', name: 'Negras', hex: '#111' }, { id: 'doradas', name: 'Doradas', hex: '#d4af37' }, { id: 'plateadas', name: 'Plateadas', hex: '#e0e0e0' }];
        const PATTERNS = ['Cactus', 'Étnico', 'Flores', 'Frutas', 'Olas', 'Pinos', 'Safari'];
        const DECORATIONS = [{ id: 'none', label: 'No', price: 0 }, { id: 'brillos', label: 'Brillos', price: 5.90 }, { id: 'pinchos', label: 'Pinchos', price: 5.90 }];
        
        // Tonos ajustados según tu captura
        const TEXT_COLORS = [
            { id: 'negro', name: 'Negro', hex: '#000000' }, 
            { id: 'blanco', name: 'Blanco', hex: '#FFFFFF' }, 
            { id: 'dorado', name: 'Dorado', hex: '#FBBF24' }, 
            { id: 'plata', name: 'Plata', hex: '#D1D5DB' }
        ];
        
        const FONTS = Array.from({length: 27}, (_, i) => `Fuente ${i + 1}`);

        const Configurator = () => {
            const [size, setSize] = useState(SIZES[2]); // Default S
            const [width, setWidth] = useState('2,5cm');
            const [closure, setClosure] = useState('Plastico');
            
            // Colores por zonas
            const [cCuello, setCCuello] = useState(BIOTHANE_COLORS[0]);
            const [cBusto, setCBusto] = useState(BIOTHANE_COLORS[0]);
            const [cTop, setCTop] = useState(BIOTHANE_COLORS[0]);
            const [cBottom, setCBottom] = useState(BIOTHANE_COLORS[0]);
            
            const [hasHandle, setHasHandle] = useState(false);
            const [tachuelaColor, setTachuelaColor] = useState(TACHUELAS_COLORS[0]);
            const [padding, setPadding] = useState(PADDING_COLORS[0]);
            
            const [hasPattern, setHasPattern] = useState(false);
            const [pattern, setPattern] = useState(PATTERNS[0]);
            
            const [hasName, setHasName] = useState(false);
            const [neckInput, setNeckInput] = useState('');
            const [bustInput, setBustInput] = useState('');
            const [petName, setPetName] = useState('');
            const [font, setFont] = useState(FONTS[0]);
            const [textColor, setTextColor] = useState(TEXT_COLORS[0]);
            
            const [hasPhone, setHasPhone] = useState(false);
            const [phoneNumber, setPhoneNumber] = useState('');
            const [decor, setDecor] = useState(DECORATIONS[0]);

            // MOTOR LÓGICO: Vigila cambios de talla para bloquear combinaciones imposibles
            useEffect(() => {
                // 1. Ancho disponible
                if (!size.allowedWidths.includes(width)) {
                    setWidth(size.allowedWidths[0]); 
                }
                // 2. Restricción de Cierre (XXS y XS = Plástico obligatorio)
                if (size.id === 'XXS' || size.id === 'XS') {
                    setClosure('Plastico');
                }
                // 3. Restricción de Asa (XXS no puede tener asa)
                if (size.id === 'XXS') {
                    setHasHandle(false);
                }
            }, [size, width]);

            const calculateClosurePrice = () => {
                if (closure === 'Cobra') {
                    return width === '2,5cm' ? 39.80 : 41.80;
                }
                return 0;
            };

            const calculateTotal = () => {
                let total = PRODUCT.basePrice;
                total += calculateClosurePrice();
                if (hasHandle) total += PRODUCT.handlePrice;
                total += padding.price;
                if (hasPattern) total += PRODUCT.patternPrice;
                if (hasName) total += PRODUCT.namePrice;
                if (hasPhone) total += PRODUCT.phonePrice;
                total += decor.price;
                return total;
            };

            const ColorSelector = ({ label, state, setState }) => (
                <div className="mb-6">
                    <label className="block text-sm font-bold mb-3">{label} *</label>
                    <div className="grid grid-cols-4 sm:grid-cols-7 gap-y-4 gap-x-2">
                        {BIOTHANE_COLORS.map(c => (
                            <div key={c.id} className="flex flex-col items-center">
                                <button onClick={() => setState(c)} className={`w-8 h-8 rounded-full border shadow-sm transition-all ${state.id === c.id ? 'ring-2 ring-offset-2 ring-doggy-dark scale-110' : 'border-gray-300 hover:scale-110'}`} style={{ backgroundColor: c.hex }}></button>
                                <span className="text-[8px] text-center mt-2 font-medium px-1 leading-tight">{c.name}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen max-w-7xl mx-auto flex flex-col-reverse lg:flex-row bg-white shadow-2xl rounded-2xl overflow-hidden my-8 border border-doggy-border">
                    
                    {/* --- ZONA IZQUIERDA: CONTROLES --- */}
                    <div className="w-full lg:w-1/2 bg-white flex flex-col h-full lg:h-[85vh] lg:border-r border-doggy-border">
                        <div className="flex-1 overflow-y-auto p-8 lg:p-12 custom-scrollbar space-y-10">
                            
                            {/* PASO 1: Tamaño y Ancho */}
                            <section>
                                <h3 className="text-xs font-bold tracking-widest text-gray-400 uppercase mb-4">Base</h3>
                                <h4 className="font-serif text-2xl font-semibold mb-4">Tamaño. Elige tu talla.</h4>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                                    {SIZES.map(sz => (
                                        <button key={sz.id} onClick={() => setSize(sz)}
                                            className={`p-3 border-2 rounded-xl text-left transition-all ${size.id === sz.id ? 'border-doggy-dark bg-doggy-base font-bold' : 'border-gray-200 hover:border-gray-300'}`}>
                                            <div className="text-lg">{sz.name}</div>
                                            <div className="text-[10px] text-gray-500 font-normal mt-1">C: {sz.neck} | B: {sz.chest}</div>
                                        </button>
                                    ))}
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-3">Selecciona el Ancho del Biothane *</label>
                                    <div className="flex gap-4">
                                        <button onClick={() => size.allowedWidths.includes('2cm') && setWidth('2cm')} 
                                            disabled={!size.allowedWidths.includes('2cm')}
                                            className={`flex-1 py-3 border-2 rounded-xl transition-all ${!size.allowedWidths.includes('2cm') ? 'opacity-40 cursor-not-allowed bg-gray-50' : (width === '2cm' ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200')}`}>
                                            2 cm {!size.allowedWidths.includes('2cm') && <span className="block text-[9px] text-red-500">(No disp.)</span>}
                                        </button>
                                        
                                        <button onClick={() => size.allowedWidths.includes('2,5cm') && setWidth('2,5cm')} 
                                            disabled={!size.allowedWidths.includes('2,5cm')}
                                            className={`flex-1 py-3 border-2 rounded-xl transition-all ${!size.allowedWidths.includes('2,5cm') ? 'opacity-40 cursor-not-allowed bg-gray-50' : (width === '2,5cm' ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200')}`}>
                                            2,5 cm {!size.allowedWidths.includes('2,5cm') && <span className="block text-[9px] text-red-500">(No disp.)</span>}
                                        </button>

                                        <button onClick={() => size.allowedWidths.includes('3,8cm') && setWidth('3,8cm')} 
                                            disabled={!size.allowedWidths.includes('3,8cm')}
                                            className={`flex-1 py-3 border-2 rounded-xl transition-all ${!size.allowedWidths.includes('3,8cm') ? 'opacity-40 cursor-not-allowed bg-gray-50' : (width === '3,8cm' ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200')}`}>
                                            3,8 cm {!size.allowedWidths.includes('3,8cm') && <span className="block text-[9px] text-red-500">(No disp.)</span>}
                                        </button>
                                    </div>
                                </div>
                            </section>

                            <hr className="border-doggy-border" />

                            {/* PASO 2: Cierre */}
                            <section>
                                <h4 className="font-serif text-2xl font-semibold mb-4">Escoge el Cierre {width} *</h4>
                                <div className="flex gap-4">
                                    <button onClick={() => setClosure('Plastico')} className={`flex-1 py-4 border-2 rounded-xl flex flex-col items-center justify-center transition-all ${closure === 'Plastico' ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200'}`}>
                                        <span className="font-medium">Plástico</span>
                                        <span className="text-xs text-gray-500 mt-1">(0,00 €)</span>
                                    </button>
                                    
                                    <button 
                                        onClick={() => !['XXS', 'XS'].includes(size.id) && setClosure('Cobra')} 
                                        disabled={['XXS', 'XS'].includes(size.id)}
                                        className={`flex-1 py-4 border-2 rounded-xl flex flex-col items-center justify-center transition-all ${['XXS', 'XS'].includes(size.id) ? 'opacity-40 cursor-not-allowed bg-gray-50' : (closure === 'Cobra' ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200')}`}>
                                        <span className="font-medium">Cobra x 2</span>
                                        {['XXS', 'XS'].includes(size.id) ? (
                                            <span className="text-[10px] text-red-500 font-bold mt-1">Bloqueado en {size.id}</span>
                                        ) : (
                                            <span className="text-xs text-doggy-accent font-bold mt-1">(+{width === '2,5cm' ? '39,80' : '41,80'} €)</span>
                                        )}
                                    </button>
                                </div>
                            </section>

                            <hr className="border-doggy-border" />

                            {/* PASO 3 a 6: Colores Zonas */}
                            <section>
                                <h4 className="font-serif text-2xl font-semibold mb-6">Diseño de Colores</h4>
                                <div className="bg-doggy-base p-6 rounded-2xl border border-doggy-border">
                                    <ColorSelector label="Color para Cuello Bajo" state={cCuello} setState={setCCuello} />
                                    <ColorSelector label="Color para Busto" state={cBusto} setState={setCBusto} />
                                    <ColorSelector label="Color para Tira Superior" state={cTop} setState={setCTop} />
                                    <ColorSelector label="Color para Tira Inferior" state={cBottom} setState={setCBottom} />
                                </div>
                            </section>

                            <hr className="border-doggy-border" />

                            {/* PASO 7 a 9: Herrajes y Acolchado */}
                            <section>
                                <h4 className="font-serif text-2xl font-semibold mb-4">Estructura y Herrajes</h4>
                                
                                <div className="mb-6">
                                    <label className="block text-sm font-medium mb-3">¿Con asa o sin asa? *</label>
                                    <div className="flex gap-4">
                                        <button onClick={() => setHasHandle(false)} className={`flex-1 py-3 border-2 rounded-xl transition-all ${!hasHandle ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200'}`}>Sin asa (0,00 €)</button>
                                        <button 
                                            onClick={() => size.id !== 'XXS' && setHasHandle(true)} 
                                            disabled={size.id === 'XXS'}
                                            className={`flex-1 py-3 border-2 rounded-xl transition-all ${size.id === 'XXS' ? 'opacity-40 cursor-not-allowed bg-gray-50' : (hasHandle ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200')}`}>
                                            Con asa {size.id === 'XXS' ? <span className="text-red-500 block text-[9px]">(No disp. en XXS)</span> : '(+3,90 €)'}
                                        </button>
                                    </div>
                                </div>

                                <div className="mb-6">
                                    <label className="block text-sm font-medium mb-3">Color de las Tachuelas *</label>
                                    <div className="flex gap-4">
                                        {TACHUELAS_COLORS.map(t => (
                                            <div key={t.id} className="flex flex-col items-center">
                                                <button onClick={() => setTachuelaColor(t)} className={`w-8 h-8 rounded-full border shadow-sm transition-all ${tachuelaColor.id === t.id ? 'ring-2 ring-offset-2 ring-doggy-dark scale-110' : 'border-gray-300'}`} style={{ backgroundColor: t.hex }}></button>
                                                <span className="text-[10px] text-center mt-2 font-medium">{t.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-3">¿Quieres que sea acolchado por dentro? *</label>
                                    <div className="grid grid-cols-4 sm:grid-cols-6 gap-y-4 gap-x-2">
                                        {PADDING_COLORS.map(p => (
                                            <div key={p.id} className="flex flex-col items-center">
                                                <button onClick={() => setPadding(p)} className={`w-8 h-8 rounded-full border transition-all ${padding.id === p.id ? 'ring-2 ring-offset-2 ring-doggy-dark scale-110' : 'border-gray-300'}`} style={{ backgroundColor: p.hex }}></button>
                                                <span className="text-[9px] text-center mt-2 px-1">{p.name} <br/><span className="text-gray-500">({p.price === 0 ? '0,00' : '+4,90'} €)</span></span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </section>

                            <hr className="border-doggy-border" />

                            {/* PASO 10: Estampado */}
                            <section>
                                <h4 className="font-serif text-2xl font-semibold mb-4">¿Quieres estampar el arnés? *</h4>
                                <div className="flex gap-4 mb-6">
                                    <button onClick={() => setHasPattern(false)} className={`flex-1 py-3 border-2 rounded-xl transition-all ${!hasPattern ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200'}`}>No (0,00 €)</button>
                                    <button onClick={() => setHasPattern(true)} className={`flex-1 py-3 border-2 rounded-xl transition-all ${hasPattern ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200'}`}>Sí (+4,90 €)</button>
                                </div>

                                <div className={`overflow-hidden transition-all duration-500 ${hasPattern ? 'max-h-[500px] opacity-100' : 'max-h-0 opacity-0'}`}>
                                    <label className="block text-sm font-bold mb-3">Diseños Predeterminados *</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        {PATTERNS.map(pat => (
                                            <button key={pat} onClick={() => setPattern(pat)} className={`p-3 border rounded-xl text-sm transition-all ${pattern === pat ? 'border-doggy-dark bg-doggy-base font-bold' : 'border-gray-200'}`}>{pat}</button>
                                        ))}
                                    </div>
                                </div>
                            </section>

                            <hr className="border-doggy-border" />

                            {/* PASO 12 a 16: Personalización Nombre */}
                            <section>
                                <h4 className="font-serif text-2xl font-semibold mb-4">¿Personalizamos el arnés con su nombre? *</h4>
                                <div className="flex gap-4 mb-6">
                                    <button onClick={() => setHasName(false)} className={`flex-1 py-3 border-2 rounded-xl transition-all ${!hasName ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200'}`}>No (0,00 €)</button>
                                    <button onClick={() => setHasName(true)} className={`flex-1 py-3 border-2 rounded-xl transition-all ${hasName ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200'}`}>Sí (+4,90 €)</button>
                                </div>

                                <div className={`space-y-6 overflow-hidden transition-all duration-500 ${hasName ? 'max-h-[800px] opacity-100' : 'max-h-0 opacity-0'}`}>
                                    <div>
                                        <label className="block text-sm font-bold mb-2">Medida Cuello Bajo *</label>
                                        <input type="text" placeholder={`Ej: 45cm (Entre ${size.neck})`} value={neckInput} onChange={(e) => setNeckInput(e.target.value)} className="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-doggy-dark"/>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold mb-2">Medida Busto *</label>
                                        <input type="text" placeholder={`Ej: 65cm (Entre ${size.chest})`} value={bustInput} onChange={(e) => setBustInput(e.target.value)} className="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-doggy-dark"/>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold mb-2">Nombre de la Mascota *</label>
                                        <input type="text" placeholder="Ej: Hércules" value={petName} onChange={(e) => setPetName(e.target.value)} className="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-doggy-dark"/>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold mb-3">Elige entre nuestras fuentes predeterminadas</label>
                                        <div className="flex flex-wrap gap-2">
                                            {FONTS.slice(0, 10).map(f => (
                                                <button key={f} onClick={() => setFont(f)} className={`px-4 py-2 border rounded-full text-sm ${font === f ? 'bg-doggy-dark text-white border-doggy-dark' : 'bg-white border-gray-300'}`}>{f}</button>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    {/* COLOR DEL TEXTO ACTUALIZADO */}
                                    <div className="bg-doggy-base p-5 rounded-xl border border-doggy-border">
                                        <label className="block text-sm font-bold mb-4">Color del Texto</label>
                                        <div className="flex gap-4">
                                            {TEXT_COLORS.map(tc => (
                                                <div key={tc.id} className="flex flex-col items-center">
                                                    <button onClick={() => setTextColor(tc)} 
                                                        className={`w-10 h-10 rounded-full border shadow-sm transition-all ${textColor.id === tc.id ? 'ring-2 ring-offset-2 ring-doggy-dark scale-110' : 'border-gray-300 hover:scale-110'}`} 
                                                        style={{ backgroundColor: tc.hex }}>
                                                    </button>
                                                    <span className="text-[10px] mt-2 font-medium">{tc.name}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </section>

                            <hr className="border-doggy-border" />

                            {/* PASO EXTRA: Teléfono, Brillos, Pinchos */}
                            <section className="pb-10">
                                <h4 className="font-serif text-2xl font-semibold mb-4">Extras de Seguridad y Decoración</h4>
                                
                                <div className="mb-6">
                                    <label className="block text-sm font-medium mb-3">Bordado extra en la zona del asa</label>
                                    <div className="flex gap-4 mb-4">
                                        <button onClick={() => setHasPhone(false)} className={`flex-1 py-3 border-2 rounded-xl transition-all ${!hasPhone ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200'}`}>No (0,00 €)</button>
                                        <button onClick={() => setHasPhone(true)} className={`flex-1 py-3 border-2 rounded-xl transition-all ${hasPhone ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200'}`}>Teléfono (+2,90 €)</button>
                                    </div>
                                    <div className={`overflow-hidden transition-all duration-300 ${hasPhone ? 'max-h-24 opacity-100' : 'max-h-0 opacity-0'}`}>
                                        <label className="block text-sm font-bold mb-2">Escribe el teléfono (Máximo 2) *</label>
                                        <input type="text" placeholder="Ej: +34 600 000 000" value={phoneNumber} onChange={(e) => setPhoneNumber(e.target.value)} className="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-doggy-dark"/>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-3">¿Quieres añadirle pinchos o brillos?</label>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        {DECORATIONS.map(d => (
                                            <button key={d.id} onClick={() => setDecor(d)}
                                                className={`p-3 border-2 rounded-xl transition-all font-medium ${decor.id === d.id ? 'border-doggy-dark bg-doggy-base' : 'border-gray-200'}`}>
                                                {d.label} <span className="block text-xs font-normal text-gray-500">({d.price === 0 ? '0,00' : `+${d.price.toFixed(2)}`} €)</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </section>

                        </div>

                        {/* FOOTER: CALCULADORA */}
                        <div className="bg-white border-t border-gray-200 p-6 lg:px-12 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)] z-10">
                            <div className="flex justify-between items-center mb-1 text-sm text-gray-600">
                                <span>Precio del producto</span>
                                <span>{PRODUCT.basePrice.toFixed(2)} €</span>
                            </div>
                            {calculateClosurePrice() > 0 && <div className="flex justify-between items-center mb-1 text-sm text-gray-600"><span>Cierre Cobra</span><span>+{calculateClosurePrice().toFixed(2)} €</span></div>}
                            {hasHandle && <div className="flex justify-between items-center mb-1 text-sm text-gray-600"><span>Asa Extra</span><span>+{PRODUCT.handlePrice.toFixed(2)} €</span></div>}
                            {padding.price > 0 && <div className="flex justify-between items-center mb-1 text-sm text-gray-600"><span>Acolchado</span><span>+{padding.price.toFixed(2)} €</span></div>}
                            {hasPattern && <div className="flex justify-between items-center mb-1 text-sm text-gray-600"><span>Estampado</span><span>+{PRODUCT.patternPrice.toFixed(2)} €</span></div>}
                            {hasName && <div className="flex justify-between items-center mb-1 text-sm text-gray-600"><span>Personalización Nombre</span><span>+{PRODUCT.namePrice.toFixed(2)} €</span></div>}
                            {hasPhone && <div className="flex justify-between items-center mb-1 text-sm text-gray-600"><span>Bordado Extra Asa</span><span>+{PRODUCT.phonePrice.toFixed(2)} €</span></div>}
                            {decor.id !== 'none' && <div className="flex justify-between items-center mb-3 text-sm text-gray-600"><span>Decoración ({decor.label})</span><span>+{decor.price.toFixed(2)} €</span></div>}
                            
                            <div className="flex justify-between items-center border-t border-gray-200 pt-4 mb-4">
                                <span className="font-serif text-2xl font-bold">Total</span>
                                <span className="font-serif text-3xl font-bold">{calculateTotal().toFixed(2)} €</span>
                            </div>

                            <button className="w-full bg-doggy-dark text-white text-lg font-bold py-4 rounded-xl hover:bg-black transition-colors shadow-lg">
                                Añadir al Carrito
                            </button>
                        </div>
                    </div>

                    {/* --- ZONA DERECHA: PREVISUALIZACIÓN --- */}
                    <div className="w-full lg:w-1/2 bg-doggy-base p-8 lg:p-12 relative border-b border-doggy-border lg:border-b-0 flex flex-col justify-center items-center">
                        <div className="sticky top-12 w-full max-w-md">
                            <h2 className="font-serif text-3xl font-bold text-center mb-2">Arnés Biothane</h2>
                            <p className="text-center text-sm text-gray-500 mb-8">{size.name} • Ancho: {width} • {closure}</p>
                            
                            <div className="relative w-full aspect-[4/3] flex flex-col items-center justify-center rounded-2xl shadow-inner transition-all duration-500 border border-gray-300 overflow-hidden bg-white"
                                 style={{ boxShadow: padding.id !== 'no' ? `inset 0 0 0 8px ${padding.hex}` : 'none' }}>
                                
                                {hasPattern && <div className="absolute inset-0 pattern-overlay opacity-30 pointer-events-none rounded-2xl z-0"></div>}

                                {/* Representación del arnés multicolor */}
                                <div className="relative w-32 h-32 border-[14px] rounded-full z-10 transition-colors" style={{ borderColor: cCuello.hex }}></div>
                                
                                {hasHandle && (
                                    <div className="absolute top-[15%] left-1/2 -translate-x-1/2 w-20 h-6 border-4 border-b-0 rounded-t-lg z-20" style={{ borderColor: cTop.hex }}></div>
                                )}
                                
                                <div className="w-6 h-16 -mt-3 z-0 transition-colors" style={{ backgroundColor: cTop.hex }}></div>
                                <div className="w-48 h-12 border-[14px] border-t-0 rounded-b-[30px] z-10 transition-colors" style={{ borderColor: cBusto.hex }}></div>
                                
                                {/* Decoración simulada (Pinchos/Brillos) en la zona del busto */}
                                {decor.id === 'brillos' && (
                                    <div className="absolute bottom-[20%] left-1/2 -translate-x-1/2 flex justify-between gap-4 z-20">
                                        <div className="w-3 h-3 bg-white rounded-full shadow-[0_0_10px_rgba(255,255,255,0.8)]"></div>
                                        <div className="w-3 h-3 bg-white rounded-full shadow-[0_0_10px_rgba(255,255,255,0.8)]"></div>
                                        <div className="w-3 h-3 bg-white rounded-full shadow-[0_0_10px_rgba(255,255,255,0.8)]"></div>
                                    </div>
                                )}
                                {decor.id === 'pinchos' && (
                                    <div className="absolute bottom-[20%] left-1/2 -translate-x-1/2 flex justify-between gap-4 z-20">
                                        <div className="w-0 h-0 border-l-[6px] border-r-[6px] border-b-[12px] border-transparent border-b-gray-400"></div>
                                        <div className="w-0 h-0 border-l-[6px] border-r-[6px] border-b-[12px] border-transparent border-b-gray-400"></div>
                                        <div className="w-0 h-0 border-l-[6px] border-r-[6px] border-b-[12px] border-transparent border-b-gray-400"></div>
                                    </div>
                                )}

                                {/* Simulación Tachuelas */}
                                <div className="absolute top-1/2 left-[38%] w-3 h-3 rounded-full z-20" style={{ backgroundColor: tachuelaColor.hex }}></div>
                                <div className="absolute top-1/2 right-[38%] w-3 h-3 rounded-full z-20" style={{ backgroundColor: tachuelaColor.hex }}></div>

                                {/* Texto Bordado Principal */}
                                {isUnique && petName && (
                                    <div className="absolute left-1/2 top-[30%] -translate-x-1/2 -translate-y-1/2 text-3xl font-serif tracking-widest drop-shadow-md z-20"
                                         style={{ color: textColor.hex }}>
                                        {petName}
                                    </div>
                                )}

                                {/* Teléfono Asa */}
                                {hasPhone && phoneNumber && (
                                    <div className="absolute top-[18%] left-1/2 -translate-x-1/2 text-[10px] font-bold opacity-90 z-20"
                                         style={{ color: isUnique ? textColor.hex : '#333' }}>
                                        {phoneNumber}
                                    </div>
                                )}

                                <div className="absolute right-4 bottom-4 bg-black/80 text-white text-[8px] px-2 py-1 font-bold tracking-widest rounded-sm z-20">
                                    DOGGYCRAFT
                                </div>
                            </div>
                            <p className="text-xs text-center text-gray-400 mt-6">*Render interactivo que muestra las 4 zonas de color del arnés.</p>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Configurator />);
    </script>
</body>
</html>
