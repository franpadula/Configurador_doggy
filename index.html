<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador DoggyCraft - Prototipo Capas</title>
    
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM para la lógica interactiva -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel para poder escribir código React moderno (JSX) directamente en el HTML -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Estilos personalizados para asegurar que las capas se superpongan perfectamente */
        .capa-producto {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Asegura que la imagen no se deforme */
            pointer-events: none; /* Hace que los clics traspasen la imagen */
            transition: opacity 0.3s ease; /* Transición suave al cambiar fotos */
        }
        
        .contenedor-producto {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1; /* Mantiene la caja cuadrada (ideal para e-commerce) */
            margin: 0 auto;
        }

        /* Ocultar scrollbar para estética más limpia en menús */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Aquí es donde React "dibujará" la aplicación -->
    <div id="root"></div>

    <!-- CÓDIGO DE LA APLICACIÓN (React/JSX) -->
    <script type="text/babel">
        const { useState } = React;

        // BASES DE DATOS DE OPCIONES
        // Aquí es donde en el futuro pondrás las URLs de tus fotos PNG recortadas
        const CINTAS = [
            { id: 'roja', nombre: 'Rojo Fuego', colorHex: '#EF4444', imgUrl: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="40" width="60" height="20" rx="10" fill="%23EF4444" opacity="0.9"/></svg>' },
            { id: 'azul', nombre: 'Azul Océano', colorHex: '#3B82F6', imgUrl: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="40" width="60" height="20" rx="10" fill="%233B82F6" opacity="0.9"/></svg>' },
            { id: 'negra', nombre: 'Negro Noche', colorHex: '#1F2937', imgUrl: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="40" width="60" height="20" rx="10" fill="%231F2937" opacity="0.9"/></svg>' },
        ];

        const ACOLCHADOS = [
            { id: 'gris', nombre: 'Gris Neutro', colorHex: '#9CA3AF', imgUrl: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="35" width="70" height="30" rx="15" fill="%239CA3AF"/></svg>' },
            { id: 'amarillo', nombre: 'Amarillo Neón', colorHex: '#FBBF24', imgUrl: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="35" width="70" height="30" rx="15" fill="%23FBBF24"/></svg>' },
        ];

        const HERRAJES = [
            { id: 'plata', nombre: 'Plata (Inox)', colorHex: '#E5E7EB', imgUrl: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="38" width="15" height="24" rx="4" fill="%23D1D5DB" stroke="%239CA3AF" stroke-width="2"/><rect x="75" y="38" width="15" height="24" rx="4" fill="%23D1D5DB" stroke="%239CA3AF" stroke-width="2"/></svg>' },
            { id: 'oro', nombre: 'Oro (Latón)', colorHex: '#FBBF24', imgUrl: 'data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="38" width="15" height="24" rx="4" fill="%23FDE68A" stroke="%23D97706" stroke-width="2"/><rect x="75" y="38" width="15" height="24" rx="4" fill="%23FDE68A" stroke="%23D97706" stroke-width="2"/></svg>' },
        ];

        // COMPONENTE PRINCIPAL
        function ConfiguradorApp() {
            // Estado para la pestaña activa
            const [pestanaActiva, setPestanaActiva] = useState('cinta');

            // Estado de las selecciones del usuario
            const [cintaElegida, setCintaElegida] = useState(CINTAS[0]);
            const [acolchadoElegido, setAcolchadoElegido] = useState(ACOLCHADOS[0]);
            const [herrajeElegido, setHerrajeElegido] = useState(HERRAJES[0]);

            return (
                <div className="min-h-screen flex flex-col font-sans text-gray-800">
                    
                    {/* CABECERA */}
                    <header className="bg-white px-6 py-4 border-b border-gray-200 flex justify-between items-center shadow-sm z-10">
                        <div>
                            <h1 className="text-xl font-bold">DoggyCraft 🇪🇸</h1>
                            <p className="text-sm text-gray-500">Prototipo de Capas PNG</p>
                        </div>
                        <div className="flex gap-4 items-center">
                            <span className="font-bold text-xl">35,90 €</span>
                            <button className="bg-black text-white px-5 py-2 rounded-lg font-medium hover:bg-gray-800 transition">
                                Añadir al Carrito
                            </button>
                        </div>
                    </header>

                    {/* CUERPO PRINCIPAL (Layout dividido) */}
                    <main className="flex-1 flex flex-col md:flex-row bg-white">
                        
                        {/* ZONA IZQUIERDA: MENÚS DE SELECCIÓN */}
                        <aside className="w-full md:w-[400px] border-r border-gray-200 flex flex-col z-10 bg-gray-50">
                            
                            {/* Pestañas Superiores */}
                            <div className="flex border-b border-gray-200 bg-white p-2">
                                <button onClick={() => setPestanaActiva('cinta')} className={`flex-1 py-3 text-sm font-semibold rounded-md transition ${pestanaActiva === 'cinta' ? 'bg-black text-white' : 'text-gray-500 hover:bg-gray-100'}`}>Cinta Principal</button>
                                <button onClick={() => setPestanaActiva('acolchado')} className={`flex-1 py-3 text-sm font-semibold rounded-md transition ${pestanaActiva === 'acolchado' ? 'bg-black text-white' : 'text-gray-500 hover:bg-gray-100'}`}>Acolchado</button>
                                <button onClick={() => setPestanaActiva('herrajes')} className={`flex-1 py-3 text-sm font-semibold rounded-md transition ${pestanaActiva === 'herrajes' ? 'bg-black text-white' : 'text-gray-500 hover:bg-gray-100'}`}>Herrajes</button>
                            </div>

                            {/* Contenido Dinámico de la Pestaña */}
                            <div className="p-6 flex-1 overflow-y-auto">
                                
                                {pestanaActiva === 'cinta' && (
                                    <div>
                                        <h3 className="text-lg font-bold mb-4">Color de la Cinta</h3>
                                        <div className="grid grid-cols-3 gap-4">
                                            {CINTAS.map(cinta => (
                                                <button 
                                                    key={cinta.id}
                                                    onClick={() => setCintaElegida(cinta)}
                                                    className={`flex flex-col items-center p-3 border-2 rounded-xl bg-white transition ${cintaElegida.id === cinta.id ? 'border-black shadow-md' : 'border-gray-200 hover:border-gray-300'}`}
                                                >
                                                    <div className="w-10 h-10 rounded-full mb-2 shadow-inner border border-gray-100" style={{ backgroundColor: cinta.colorHex }}></div>
                                                    <span className="text-xs font-medium text-center">{cinta.nombre}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {pestanaActiva === 'acolchado' && (
                                    <div>
                                        <h3 className="text-lg font-bold mb-4">Color del Acolchado</h3>
                                        <div className="space-y-3">
                                            {ACOLCHADOS.map(acolchado => (
                                                <button 
                                                    key={acolchado.id}
                                                    onClick={() => setAcolchadoElegido(acolchado)}
                                                    className={`w-full flex items-center gap-4 p-4 border-2 rounded-xl bg-white transition ${acolchadoElegido.id === acolchado.id ? 'border-black shadow-md' : 'border-gray-200 hover:border-gray-300'}`}
                                                >
                                                    <div className="w-8 h-8 rounded-full shadow-inner border border-gray-100" style={{ backgroundColor: acolchado.colorHex }}></div>
                                                    <span className="text-sm font-medium">{acolchado.nombre}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {pestanaActiva === 'herrajes' && (
                                    <div>
                                        <h3 className="text-lg font-bold mb-4">Acabado de los Herrajes</h3>
                                        <div className="grid grid-cols-2 gap-4">
                                            {HERRAJES.map(herraje => (
                                                <button 
                                                    key={herraje.id}
                                                    onClick={() => setHerrajeElegido(herraje)}
                                                    className={`flex flex-col items-center p-4 border-2 rounded-xl bg-white transition ${herrajeElegido.id === herraje.id ? 'border-black shadow-md' : 'border-gray-200 hover:border-gray-300'}`}
                                                >
                                                    <div className="w-12 h-12 rounded-full mb-2 shadow-inner border border-gray-200" style={{ backgroundColor: herraje.colorHex }}></div>
                                                    <span className="text-sm font-medium">{herraje.nombre}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                
                                <div className="mt-8 p-4 bg-blue-50 text-blue-800 text-sm rounded-lg border border-blue-100">
                                    <strong>Nota para socios:</strong> Este panel actualizará la foto de la derecha combinando múltiples PNGs transparentes generados desde una única foto maestra.
                                </div>
                            </div>
                        </aside>

                        {/* ZONA DERECHA: VISOR VISUAL (La "Magia" de las Capas) */}
                        <section className="flex-1 bg-white relative flex items-center justify-center p-8 overflow-hidden" style={{ backgroundImage: 'radial-gradient(#e5e7eb 1px, transparent 1px)', backgroundSize: '20px 20px' }}>
                            
                            {/* EL CONTENEDOR MÁGICO DE LAS CAPAS */}
                            <div className="contenedor-producto drop-shadow-2xl">
                                
                                {/* 
                                    IMPORTANTE PARA EL CÓDIGO FINAL:
                                    En producción, reemplazarás "imgUrl" por las rutas a tus fotos PNG reales.
                                    Ejemplo: <img src={`/assets/acolchados/${acolchadoElegido.id}.png`} />
                                */}
                                
                                {/* Capa 1: Acolchado (Fondo) */}
                                <img src={acolchadoElegido.imgUrl} className="capa-producto" alt="Acolchado" />
                                
                                {/* Capa 2: Cinta Principal (Medio) */}
                                <img src={cintaElegida.imgUrl} className="capa-producto" alt="Cinta" />
                                
                                {/* Capa 3: Herrajes (Arriba del todo) */}
                                <img src={herrajeElegido.imgUrl} className="capa-producto" alt="Herrajes" />

                                {/* Capa de Interacción (Opcional a futuro): 
                                    Aquí podríamos añadir rectángulos transparentes <div onClick={...}> 
                                    posicionados sobre las hebillas para que el usuario pueda hacer clic 
                                    en la propia foto y cambiar la pestaña, como hablamos antes. 
                                */}
                            </div>

                        </section>
                    </main>
                </div>
            );
        }

        // Iniciar la aplicación
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ConfiguradorApp />);
    </script>
</body>
</html>
